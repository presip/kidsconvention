{% extends 'base.html' %}{% block content %}
<div class='card p-4'>
    <h3>Register Kid</h3>
    <form method='post'>
        <input class='form-control mb-3' name='name' placeholder='Name'>
        <input class='form-control mb-3' name='age' placeholder='Age'>
        <input class='form-control mb-3' name='locality' placeholder='Locality'>
        <input class='form-control mb-3' name='city' placeholder='City'>
        <input class='form-control mb-3' name='contactnumber' placeholder='Contact Number'>
        <input class='form-control mb-3' name='parent_kid_id' list="kids_list" placeholder='Friend brought by Kid ID'>
        <datalist id="kids_list">
            {% for k in kids %}
            <option value="{{ k.kid_id }}">
                {{ k.kid_id }} - {{ k.name }} - Age {{ k.age }}
            </option>
            {% endfor %}
        </datalist>
        <button class='btn btn-success'>Register</button>
    </form>
</div>{% endblock %}
